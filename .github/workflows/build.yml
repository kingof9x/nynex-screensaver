name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. "next" = last release + 1 (for example 1.3 after 1.2), or type one (for example 2.0). Empty = only test the build, no release.'
        required: false
        default: 'next'

permissions:
  contents: write

jobs:
  version:
    # Works out the release version: from the Run workflow box ("next" = last release + 1)
    # or from a pushed v* tag. Empty means "only test the build, no release".
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT: ${{ inputs.version }}
        run: |
          v=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=$(printf '%s' "$GITHUB_REF_NAME" | grep -oE '[0-9]+(\.[0-9]+)*$' || true)
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$INPUT" ]; then
            if [ "$INPUT" = next ]; then
              last=$(gh api "repos/$REPO/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name][0] // ""')
              num=$(printf '%s' "$last" | grep -oE '[0-9]+(\.[0-9]+)*$' || true)
              if [ -z "$num" ]; then v=1.0; else v=$(printf '%s' "$num" | awk -F. -v OFS=. '{$NF=$NF+1; print}'); fi
              echo "Last release: ${last:-none}"
            else
              v="${INPUT#[vV]}"
            fi
          fi
          if [ -n "$v" ] && ! printf '%s' "$v" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::'$v' is not a version number. Use numbers like 1.4 or 2.0.1, or 'next'."; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=${v:+v$v}" >> "$GITHUB_OUTPUT"
          if [ -n "$v" ]; then echo "### Releasing v$v" >> "$GITHUB_STEP_SUMMARY"; else echo "### Test build only, no release" >> "$GITHUB_STEP_SUMMARY"; fi

  build:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Smoke test (render one frame with no window)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 320, 180
          for ($y = 0; $y -lt 180; $y++) { for ($x = 0; $x -lt 320; $x++) {
            if ($y -lt 90) { $c = [System.Drawing.Color]::FromArgb(90, 140, 220) } else { $c = [System.Drawing.Color]::FromArgb(60, 140, 50) }
            $bmp.SetPixel($x, $y, $c) } }
          $bmp.Save("$PWD\test.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $p = Start-Process -FilePath target\release\nynex.exe -ArgumentList "--render","test.png","frame.png","--size","640x360" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -or -not (Test-Path frame.png)) { throw "render failed" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\nynex.exe dist\nynex.exe
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\* -DestinationPath nynex-screensaver-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: nynex-screensaver-windows-x64
          path: |
            dist/nynex.exe
            dist/README.md

      - name: Publish release
        if: needs.version.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" nynex-screensaver-windows-x64.zip dist/nynex.exe --clobber
          else
            gh release create "$TAG" \
              nynex-screensaver-windows-x64.zip dist/nynex.exe \
              --target "$GITHUB_SHA" \
              --title "nynex screensaver ${TAG#v}" \
              --generate-notes
          fi

  linux:
    # Linux / Omarchy build. Runs after the Windows job so the release already exists.
    needs: [version, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Smoke test (render one frame with no window)
        run: |
          python3 -c "
          import zlib, struct
          w, h = 320, 180
          rows = b''.join(b'\x00' + bytes((90,140,220) if y < 90 else (60,140,50)) * w for y in range(h))
          def chunk(t, d): return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          open('test.png', 'wb').write(b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(rows)) + chunk(b'IEND', b''))
          "
          target/release/nynex --render test.png frame.png --size 640x360
          test -s frame.png

      - name: Package
        run: |
          cp target/release/nynex nynex-linux-x86_64
          tar czf nynex-screensaver-linux-x86_64.tar.gz -C target/release nynex -C "$GITHUB_WORKSPACE" README.md

      - uses: actions/upload-artifact@v4
        with:
          name: nynex-screensaver-linux-x86_64
          path: |
            nynex-linux-x86_64
            nynex-screensaver-linux-x86_64.tar.gz

      - name: Publish release
        if: needs.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" nynex-linux-x86_64 nynex-screensaver-linux-x86_64.tar.gz --clobber
