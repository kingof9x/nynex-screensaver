[package]
name = "nynex-screensaver"
version = "0.1.0"
edition = "2021"
description = "Animated pixel-art / ASCII landscape screensaver for Windows"

[[bin]]
name = "nynex"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
winit = "0.30"
softbuffer = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
rayon = "1"
rfd = "0.18"
font8x8 = "0.3"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
